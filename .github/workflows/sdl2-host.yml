name: Experimental SDL2 subset
on:
  pull_request:
    paths:
      - 'ports/sdl2/**'
      - 'sdk/**'
      - '.github/workflows/sdl2-host.yml'
  push:
    branches: [main]
    paths:
      - 'ports/sdl2/**'
      - 'sdk/**'
      - '.github/workflows/sdl2-host.yml'
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          sudo python3 tools/ci_apt_mirrors.py
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib binutils make python3
      - name: Host contracts (ASan/UBSan x86_64 and native i686)
        run: make -C ports/sdl2 test
      - name: Cross-build both optional archives and the demo package
        run: make -C ports/sdl2 all && make -C ports/sdl2/test -j2
