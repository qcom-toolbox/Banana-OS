name: Build ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release-tag:
    name: Reserve exact source revision for release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Reserve or verify the immutable build tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-$GITHUB_RUN_NUMBER"
          # Reserve while this push is at main's head. GitHub's workflow-file
          # permission guard can reject tagging older revisions at publish time.
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            test "$existing" = "$GITHUB_SHA" || { echo "Build tag points to another commit"; exit 1; }
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
          fi

  build:
    needs: [libjs, mesa]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, mesa]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo python3 tools/ci_apt_mirrors.py
          sudo apt-get update -qq
          sudo apt-get install -y nasm gcc-multilib binutils xorriso mtools python3 sbsigntool efitools ncurses-bin zsh cmake git

      # Secure Boot: the loaders are signed with the Banana OS key (a repository
      # secret); without it (forks) they are built unsigned
      - name: Secure Boot key
        env:
          SB_KEY_PEM: ${{ secrets.BANANA_SB_KEY }}
        run: |
          if [ -n "$SB_KEY_PEM" ]; then
            mkdir -p ~/.banana-secureboot && chmod 700 ~/.banana-secureboot
            printf '%s\n' "$SB_KEY_PEM" > ~/.banana-secureboot/banana-sb.key
            chmod 600 ~/.banana-secureboot/banana-sb.key
          fi

      # FFmpeg for the Media Player and Music apps (ports/ffmpeg/build.sh):
      # built once, then kept until the build script or the SDK's libc changes
      - name: FFmpeg build cache
        uses: actions/cache@v4
        with:
          path: |
            ports/ffmpeg/src
            ports/ffmpeg/build
          key: ffmpeg-7.1-${{ hashFiles('ports/ffmpeg/build.sh', 'sdk/lib/*.c', '!sdk/lib/banana.c', 'sdk/include/**', '!sdk/include/banana*.h') }}

      # the Unix programs in /bin (ports/<name>/build.sh with ports/port.sh,
      # 64-bit): bash, coreutils, grep, sed, findutils, diffutils, gawk,
      # ncurses (+ terminfo), less, zsh; the optional editors (nano, vim, vi,
      # neovim) and git - the downloads kept, the builds too
      # while their scripts and the SDK stay (port.sh reconfigures otherwise)
      - name: Unix ports build cache
        uses: actions/cache@v4
        with:
          path: |
            ports/bash/src
            ports/bash/build
            ports/coreutils/src
            ports/coreutils/build
            ports/grep/src
            ports/grep/build
            ports/sed/src
            ports/sed/build
            ports/findutils/src
            ports/findutils/build
            ports/diffutils/src
            ports/diffutils/build
            ports/gawk/src
            ports/gawk/build
            ports/ncurses/src
            ports/ncurses/build
            ports/less/src
            ports/less/build
            ports/zsh/src
            ports/zsh/build
            ports/nano/src
            ports/nano/build
            ports/vim/src
            ports/vim/build
            ports/vi/src
            ports/vi/build
            ports/neovim/src
            ports/neovim/build
            ports/git/src
            ports/git/build
            ports/neofetch/src
            ports/neofetch/build
          key: unix-ports-v2-${{ hashFiles('ports/port.sh', 'ports/bash/*', 'ports/coreutils/*', 'ports/grep/*', 'ports/sed/*', 'ports/findutils/*', 'ports/diffutils/*', 'ports/gawk/*', 'ports/ncurses/*', 'ports/less/*', 'ports/zsh/*', 'ports/nano/*', 'ports/vim/*', 'ports/vi/*', 'ports/neovim/*', 'ports/git/*', 'ports/neofetch/*', 'sdk/tools/banana-*', 'sdk/lib/*.c', 'sdk/include/**') }}
          restore-keys: unix-ports-v2-

      - name: Test shared BIOS and UEFI image data
        run: python3 tools/test_mkimage.py

      - name: Download the integrated LibJS renderer
        uses: actions/download-artifact@v4
        with:
          name: experimental-libjs-packages
          path: libjs-packages
      - name: Verify LibJS package checksums
        working-directory: libjs-packages
        run: sha256sum -c LIBJS-SHA256SUMS

      - name: Download Intel Mesa runtime
        if: matrix.variant == 'mesa'
        uses: actions/download-artifact@v4
        with:
          name: mesa-intel-runtime
          path: mesa-packages
      - name: Verify Intel Mesa runtime
        if: matrix.variant == 'mesa'
        working-directory: mesa-packages
        run: sha256sum -c MESA-SHA256SUMS

      - name: Build Banana_OS.iso (64-bit) and Banana_OS-32.iso
        run: |
          make clean
          mesa_args=()
          images=(Banana_OS.iso)
          if [ "${{ matrix.variant }}" = mesa ]; then
            mesa_args+=(MESA_BPK="$PWD/mesa-packages/mesa-x86_64.bpk")
          else
            images+=(Banana_OS-32.iso)       # (the 32-bit kernel alone: no Mesa, no ports - one build of it)
          fi
          # (in parallel: a clean build is 2.5 min on the runner's 4 cores instead of ~9)
          make -j"$(nproc)" ISO_KERNELS=64 LIBJS_WORKER_BPK="$PWD/libjs-packages/libjsworker-x86_64.bpk" "${mesa_args[@]}" "${images[@]}"
          rm -f ~/.banana-secureboot/banana-sb.key

      # the corresponding source of the ports built into the images (the
      # upstream archives as fetched, checked; the trees from git)
      - name: Collect the ports' sources
        if: matrix.variant == 'standard'
        run: python3 tools/collect_sources.py sources-ports bash coreutils grep sed findutils diffutils gawk ncurses less zsh nano vim vi neofetch neovim git ffmpeg tcc
      - name: Retain the ports' sources
        if: matrix.variant == 'standard'
        uses: actions/upload-artifact@v4
        with:
          name: sources-ports-${{ github.sha }}
          path: sources-ports
          if-no-files-found: error
          retention-days: 3
      - name: Retain the 32-bit ISO
        if: matrix.variant == 'standard'
        uses: actions/upload-artifact@v4
        with:
          name: boot-iso-32-${{ github.sha }}
          path: Banana_OS-32.iso
          if-no-files-found: error
          retention-days: 3

      - name: Export application SDK independently
        if: matrix.variant == 'standard'
        run: make sdk
      - name: Retain application SDK
        if: matrix.variant == 'standard'
        uses: actions/upload-artifact@v4
        with:
          name: application-sdk-${{ github.sha }}
          path: banana-sdk.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Name the Mesa ISO
        if: matrix.variant == 'mesa'
        run: mv Banana_OS.iso Banana_OS-mesa.iso

      - name: Retain the exact ISO for boot validation
        uses: actions/upload-artifact@v4
        with:
          name: boot-iso-${{ matrix.variant }}-${{ github.sha }}
          path: ${{ matrix.variant == 'mesa' && 'Banana_OS-mesa.iso' || 'Banana_OS.iso' }}
          if-no-files-found: error
          retention-days: 3

  # Java for Banana OS (64-bit): java.bpk (ports/openjdk/package.sh) - the java
  # app, and /usr/java, which `pkg install java.bpk` unpacks: jdk/ (ports/openjdk),
  # lib/libOSMesa.so (the mesa job's: Intel Crocus/Iris unless gpu3d off, then
  # VirGL, then softpipe) and lwjgl/ (ports/lwjgl)
  boot:
    name: Validate ${{ matrix.variant }} ${{ matrix.firmware }} upgrade from build ${{ matrix.install_build }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, mesa]
        firmware: [bios, uefi]
        install_build: [212, 218]
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        timeout-minutes: 10
        run: |
          sudo python3 tools/ci_apt_mirrors.py
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends python3 qemu-system-x86 qemu-utils ovmf gcc e2fsprogs
          # qemu-img is required by ci-install-test.sh; install it explicitly
          # because qemu-system-x86 only recommends qemu-utils.
          qemu-img --version
      - uses: actions/download-artifact@v4
        with:
          name: boot-iso-${{ matrix.variant }}-${{ github.sha }}
      - name: Select Mesa ISO for validation
        if: matrix.variant == 'mesa'
        run: mv Banana_OS-mesa.iso Banana_OS.iso
      - name: Download previous installation fixture (build ${{ matrix.install_build }})
        run: |
          curl -fL --retry 3 -o previous.iso https://github.com/qcom-toolbox/Banana-OS/releases/download/build-${{ matrix.install_build }}/Banana_OS.iso
          case "${{ matrix.install_build }}" in
            212) expected=a71ee27998d0af3b9ca2d60d271cc8bc7f50dc8054a4e0f0c600df7b30333a23 ;;
            218) expected=0adf9de2ae15764454634825c04515769bb1f0650e2c52d967f2c0927e788bde ;;
            *) exit 1 ;;
          esac
          echo "$expected  previous.iso" | sha256sum -c -
      - name: Boot, install, update and verify persistence
        env:
          BASE_ISO: previous.iso
          MESA_ISO: ${{ matrix.variant == 'mesa' && '1' || '0' }}
        run: |
          python3 tools/test_serialtest.py
          bash tools/ci-boot.sh "${{ matrix.firmware }}"
          bash tools/ci-install-test.sh "${{ matrix.firmware }}"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.variant }}-${{ matrix.firmware }}-from-${{ matrix.install_build }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/logs/**/*.log
            build/logs/**/provenance.txt
          retention-days: 14

  java:
    needs: [mesa]
    # (the toolchain the OpenJDK reference build and LWJGL were made with:
    #  ubuntu-latest moved to 26.04 / GCC 15, which fails LWJGL's stb_dxt)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java's OpenGL is the Intel Mesa runtime's libOSMesa.so (Crocus and
      # Iris for the GPU, VirGL, softpipe), not a software-only build
      - name: Download Intel Mesa runtime
        uses: actions/download-artifact@v4
        with:
          name: mesa-intel-runtime
          path: mesa-intel
      - name: Verify Intel Mesa runtime
        working-directory: mesa-intel
        run: sha256sum -c MESA-SHA256SUMS && test -f libOSMesa.so

      # the JDK and LWJGL builds, kept while nothing they are built from
      # changes (before the caches below: their folders must not be hashed)
      - name: Java parts cache
        id: bundle
        uses: actions/cache@v4
        with:
          path: java-parts
          key: java-parts-v1-${{ hashFiles('ports/openjdk/*.sh', 'ports/openjdk/*.py', 'ports/openjdk/include/**', 'ports/openjdk/launcher/*.c', 'ports/openjdk/launcher/Makefile', 'ports/openjdk/test/**', 'ports/mesa/*.sh', 'ports/mesa/*.py', 'ports/mesa/gl3test/*.c', 'ports/mesa/gl3test/Makefile', 'ports/lwjgl/*.sh', 'ports/lwjgl/native/**', 'ports/lwjgl/test/**', 'sdk/lib/**', 'sdk/include/**', 'sdk/banana.mk', 'sdk/tools/**') }}

      - name: Install build dependencies
        if: steps.bundle.outputs.cache-hit != 'true'
        run: |
          # (room for OpenJDK's reference build)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo python3 tools/ci_apt_mirrors.py
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib g++ binutils make python3 autoconf zip unzip file libffi-dev \
            mtools fdisk meson ninja-build flex bison python3-mako python3-yaml zlib1g-dev pkg-config \
            libasound2-dev libcups2-dev libfontconfig1-dev libx11-dev libxext-dev libxrender-dev \
            libxrandr-dev libxtst-dev libxt-dev

      # the reference Linux builds (OpenJDK ~1 h, Mesa): their command lines are
      # replayed against the SDK. They depend only on the versions in the scripts:
      # bump the -v suffix when a script's configure / meson options change
      - name: OpenJDK reference build cache
        if: steps.bundle.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ports/openjdk/src
          key: openjdk-ref-17.0.20.1-server-v1
      - name: Mesa reference build cache
        if: steps.bundle.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ports/mesa/src
            ports/mesa/build/ref
          key: mesa-ref-24.3.4-${{ hashFiles('ports/mesa/build.sh', 'ports/mesa/patch.py') }}

      - name: Build OpenJDK, Mesa and LWJGL
        if: steps.bundle.outputs.cache-hit != 'true'
        run: |
          sh ports/openjdk/build.sh
          sh ports/mesa/build.sh
          JAVA_BIN=$PWD/ports/openjdk/src/jdk-17.0.20.1+1/bin sh ports/lwjgl/build.sh

      - name: Keep the JDK and LWJGL builds
        if: steps.bundle.outputs.cache-hit != 'true'
        run: |
          rm -rf java-parts && mkdir -p java-parts/jdk-out java-parts/lwjgl-out
          cp -r ports/openjdk/build/jdk java-parts/jdk-out/
          cp -r ports/lwjgl/build/lwjgl java-parts/lwjgl-out/
          # the reference builds' objects are not replayed: smaller caches
          find ports/openjdk/src -path '*/build/*' -name '*.o' -delete
          find ports/mesa/build/ref -name '*.o' -delete

      - name: Install packaging tools
        if: steps.bundle.outputs.cache-hit == 'true'
        run: |
          sudo python3 tools/ci_apt_mirrors.py
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib binutils make python3 zip

      - name: Pack java.bpk
        env:
          JDK_OUT: ${{ github.workspace }}/java-parts/jdk-out
          LWJGL_OUT: ${{ github.workspace }}/java-parts/lwjgl-out
          MESA_OUT: ${{ github.workspace }}/mesa-intel
        run: |
          sh ports/openjdk/package.sh "$PWD/java-bundle"
          # the bundle's OpenGL must be the GPU-capable one
          unzip -p java-bundle/java.zip lib/libOSMesa.so | cmp - mesa-intel/libOSMesa.so
          rm -rf java-bundle/usr-java java-bundle/java.zip
          ls -la java-bundle/java.bpk

      - name: Upload java.bpk
        uses: actions/upload-artifact@v4
        with:
          name: java-bundle
          path: java-bundle/java.bpk
          retention-days: 3

      # OpenJDK's, LWJGL's and libffi's source archives (checked against the
      # scripts' SHA-256) for the release's corresponding source
      - name: Collect Java's sources
        run: |
          SOURCES_ONLY=1 sh ports/openjdk/build.sh
          SOURCES_ONLY=1 sh ports/lwjgl/build.sh
          SOURCES_JOB=java python3 tools/collect_sources.py sources-java openjdk:archives lwjgl:archives
      - name: Retain Java's sources
        uses: actions/upload-artifact@v4
        with:
          name: sources-java-${{ github.sha }}
          path: sources-java
          if-no-files-found: error
          retention-days: 3

  # Build the isolated renderer before embedding it in the 64-bit ISO.
  # Keep audited packages/notices as internal CI artifacts; the worker ships in the ISO.
  libjs:
    uses: ./.github/workflows/libjs-reference.yml
    permissions:
      contents: read
    with:
      sdk: true

  mesa:
    name: Mesa GPU runtime (Intel Crocus and Iris, AMD r600)
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Install toolchain
        run: |
          apt-get update -qq
          apt-get install -y ca-certificates git gcc-multilib g++ make binutils python3 curl xz-utils cmake \
            meson ninja-build flex bison python3-mako python3-yaml pkg-config libdrm-dev zlib1g-dev spirv-tools \
            llvm-17-dev libclang-17-dev libclang-cpp17-dev libclc-17-dev libllvmspirvlib-17-dev mtools fdisk
      - uses: actions/checkout@v4
      - name: Mesa build cache
        uses: actions/cache@v4
        with:
          path: |
            ports/mesa/src
            ports/mesa/build-crocus-iris-r600
          key: mesa-intel-trixie-v1-${{ hashFiles('ports/mesa/**', '!ports/mesa/src/**', '!ports/mesa/build*/**', 'sdk/lib/**', 'sdk/include/**', 'sdk/banana.mk', 'sdk/tools/**') }}
      - name: Build the GPU drivers and runtime package
        run: |
          CROCUS=1 IRIS=1 R600=1 JOBS=4 sh ports/mesa/build.sh
          make -C ports/mesa/runtime mesa-x86_64.bpk
          mkdir -p mesa-packages
          cp ports/mesa/runtime/mesa-x86_64.bpk mesa-packages/
          # (the same library goes into java.bpk: Java's OpenGL on the GPU)
          cp ports/mesa/build-crocus-iris-r600/libOSMesa.so mesa-packages/
          (cd mesa-packages && sha256sum mesa-x86_64.bpk libOSMesa.so > MESA-SHA256SUMS)
          # Mesa's source archive, for the release's corresponding source
          SOURCES_JOB=mesa python3 tools/collect_sources.py sources-mesa mesa:archives
      - name: Test pristine Mesa patching
        run: python3 tools/tests/mesa_patch.py
      - name: Test Intel kernel interface
        run: |
          cc -O1 -g -no-pie -w -fsanitize=undefined -fno-sanitize-recover=all -I kernel -I tools/tests tools/tests/test_i915.c kernel/gpu_i915.c kernel/gpu_i915_lrc.c kernel/gpu_gem.c -o /tmp/i915
          /tmp/i915
      - name: Test display compatibility in both architectures
        run: |
          for bits in 32 64; do
            cc -m"$bits" -O1 -I kernel tools/tests/test_gpu_drivers.c kernel/gpu_intel.c kernel/gpu_radeon.c third_party/radeon/evergreen_wm.c -o "/tmp/display-$bits"
            "/tmp/display-$bits"
          done
      - name: Test the vsync wait on a simulated display (sleeps, not spins)
        run: |
          cc -O1 -g -fsanitize=address,undefined -Wall -I kernel tools/tests/vblank_wait.c -o /tmp/vblank-wait
          /tmp/vblank-wait
      - name: Test Radeon TeraScale 2 mode setting on a model video BIOS
        run: bash tools/tests/radeon_kms.sh
      - name: Test the Radeon HD 7450 3D engine bring-up on a model command processor
        run: sh tools/tests/radeon_gfx.sh
      - name: Test both Mesa drivers on Intel models
        env:
          MESA_REF: ${{ github.workspace }}/ports/mesa/build-crocus-iris-r600/ref
        run: |
          sh tools/tests/crocus_host/run.sh 30
          sh tools/tests/iris_host/run.sh 30
      - name: Test Mesa's r600 on the Radeon HD 7450 model (Linux's command checker on every stream)
        env:
          MESA_REF: ${{ github.workspace }}/ports/mesa/build-crocus-iris-r600/ref
          MODEL_QUIET: 1
        run: sh tools/tests/radeon_host/run.sh 30
      - name: Test pipelined OpenGL window swaps (softpipe, and r600 on the model)
        env:
          MESA_REF: ${{ github.workspace }}/ports/mesa/build-crocus-iris-r600/ref
          MODEL_QUIET: 1
        run: sh tools/tests/gl3_host/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mesa-intel-runtime
          path: mesa-packages/*
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: sources-mesa-${{ github.sha }}
          path: sources-mesa
          if-no-files-found: error
          retention-days: 3

  network-host:
    uses: ./.github/workflows/network-host.yml
    permissions:
      contents: read

  network:
    name: Network regression (${{ matrix.model }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        model: [e1000, e1000e, igb, pcnet, rtl8139, virtio-net-pci, usb-ecm, multi]
    steps:
      - uses: actions/checkout@v4
      - name: Install headless QEMU test dependencies
        timeout-minutes: 10
        run: |
          sudo python3 tools/ci_apt_mirrors.py
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends qemu-system-x86 python3
      - uses: actions/download-artifact@v4
        with:
          name: boot-iso-standard-${{ github.sha }}
      - name: DHCP, ping, verified 30 MiB download and link failover
        timeout-minutes: 12
        run: python3 tools/test_network_vm.py --model ${{ matrix.model }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-${{ matrix.model }}-${{ github.sha }}
          path: |
            build/logs/network-${{ matrix.model }}/*.log
            build/logs/network-${{ matrix.model }}/*.txt
            build/logs/network-${{ matrix.model }}/*.json
          if-no-files-found: warn
          retention-days: 7

  power-host:
    uses: ./.github/workflows/power-host.yml
    permissions:
      contents: read

  power:
    name: Laptop ACPI and USB-C PD (${{ matrix.firmware }}, ${{ matrix.bits }}-bit)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {firmware: bios, bits: 64}
          - {firmware: bios, bits: 32}
          - {firmware: uefi, bits: 64}
    steps:
      - uses: actions/checkout@v4
      - name: Install headless QEMU test dependencies
        timeout-minutes: 10
        run: |
          sudo python3 tools/ci_apt_mirrors.py
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends qemu-system-x86 ovmf acpica-tools python3
      - uses: actions/download-artifact@v4
        with:
          name: boot-iso-${{ matrix.bits == 32 && '32' || 'standard' }}-${{ github.sha }}
      - name: The 32-bit image (Banana_OS-32.iso) for the 32-bit run
        if: matrix.bits == 32
        run: mv Banana_OS-32.iso Banana_OS.iso
      - name: Battery, backlight, PD contracts and power-role changes via AML
        timeout-minutes: 12
        run: |
          args=()
          if [ "${{ matrix.bits }}" = 32 ]; then args+=(--32); fi
          python3 tools/test_laptop_vm.py --firmware "${{ matrix.firmware }}" "${args[@]}"
          python3 tools/test_laptop_vm.py --firmware "${{ matrix.firmware }}" "${args[@]}" --reject-role
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laptop-${{ matrix.firmware }}-${{ matrix.bits }}-${{ github.sha }}
          path: |
            build/logs/laptop-*/*.log
            build/logs/laptop-*/*.txt
            build/logs/laptop-*/*.json
          if-no-files-found: warn
          retention-days: 7

  os-regression:
    name: Offline OS regression (${{ matrix.firmware }}, ${{ matrix.bits }}-bit)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {firmware: bios, bits: 64}
          - {firmware: bios, bits: 32}
          - {firmware: uefi, bits: 64}
    steps:
      - uses: actions/checkout@v4
      - name: Install headless test dependencies
        timeout-minutes: 10
        run: |
          sudo python3 tools/ci_apt_mirrors.py
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends qemu-system-x86 ovmf python3
      - uses: actions/download-artifact@v4
        with:
          name: boot-iso-${{ matrix.bits == 32 && '32' || 'standard' }}-${{ github.sha }}
      - name: The 32-bit image (Banana_OS-32.iso) for the 32-bit run
        if: matrix.bits == 32
        run: mv Banana_OS-32.iso Banana_OS.iso
      - name: Full selftest, local sockets, POSIX and supported application suites
        run: |
          args=()
          if [ "${{ matrix.bits }}" = 32 ]; then args+=(--32); fi
          python3 tools/test_os_vm.py --firmware "${{ matrix.firmware }}" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: os-regression-${{ matrix.firmware }}-${{ matrix.bits }}-${{ github.sha }}
          path: build/logs/os-*/*
          if-no-files-found: warn
          retention-days: 14

  command-host:
    uses: ./.github/workflows/kcmd-output-host.yml
    permissions:
      contents: read

  driver-sdk-host:
    uses: ./.github/workflows/driver-sdk.yml
    permissions:
      contents: read

  driver-sdk-vm:
    name: External driver modules (${{ matrix.firmware }}, ${{ matrix.bits }}-bit)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {firmware: bios, bits: 64}
          - {firmware: bios, bits: 32}
          - {firmware: uefi, bits: 64}
    steps:
      - uses: actions/checkout@v4
      - name: Install headless driver test dependencies
        timeout-minutes: 15
        run: |
          sudo python3 tools/ci_apt_mirrors.py
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends qemu-system-x86 ovmf acpica-tools gcc-multilib binutils make python3
      - uses: actions/download-artifact@v4
        with:
          name: boot-iso-${{ matrix.bits == 32 && '32' || 'standard' }}-${{ github.sha }}
      - name: The 32-bit image (Banana_OS-32.iso) for the 32-bit run
        if: matrix.bits == 32
        run: mv Banana_OS-32.iso Banana_OS.iso
      - name: Load frozen ABI module and SDK USB/laptop examples
        timeout-minutes: 12
        run: |
          args=()
          if [ "${{ matrix.bits }}" = 32 ]; then args+=(--32); fi
          python3 tools/test_driver_sdk_vm.py --firmware "${{ matrix.firmware }}" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-vm-${{ matrix.firmware }}-${{ matrix.bits }}-${{ github.sha }}
          path: |
            build/logs/driver-sdk-*/*.log
            build/logs/driver-sdk-*/*.txt
            build/logs/driver-sdk-*/*.json
          if-no-files-found: warn
          retention-days: 7

  publish-isos:
    name: Publish the validated ISOs, java.bpk and the sources
    # (java is required: a release always has its java.bpk; the all-in-one
    #  image is not - publish-full adds it when it is ready)
    needs: [release-tag, build, boot, java, mesa, network, network-host, power, power-host, command-host, driver-sdk-host, driver-sdk-vm, os-regression]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Verify release tag matches the tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/build-$GITHUB_RUN_NUMBER" --jq '.object.sha')
          test "$actual" = "$GITHUB_SHA" || { echo "Refusing mismatched release tag"; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          pattern: boot-iso-*-${{ github.sha }}
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: java-bundle
      - uses: actions/download-artifact@v4
        with:
          name: application-sdk-${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: driver-sdk-${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: sources-*-${{ github.sha }}
          path: sources
      # the corresponding source: every upstream archive the builds used, and
      # the repository at this tag (scripts, patches, Banana OS) - one file
      - name: Assemble Banana_OS-sources.tar
        run: |
          set -euo pipefail
          mkdir -p src-out/upstream
          for d in sources/*/; do cp -r "$d"/. src-out/upstream/; done
          git -C repo archive --format=tar.gz --prefix="banana-os-$GITHUB_SHA/" -o "$PWD/src-out/banana-os-$GITHUB_SHA.tar.gz" HEAD
          {
            echo "Banana OS build $GITHUB_RUN_NUMBER ($GITHUB_SHA) - corresponding source"
            echo "upstream/<port>/: as ports/<port>/build.sh fetched it; banana-os-*.tar.gz: the repository at this tag."
            echo "Licences: banana-os-*/LICENSES/, banana-os-*/THIRD-PARTY-NOTICES."
            echo
            echo "sha256  size  file"
            cat src-out/upstream/SOURCES-*.txt | sed 's|  \([^ ]*\)$|  upstream/\1|'
            (cd src-out && sha256sum "banana-os-$GITHUB_SHA.tar.gz" | awk -v s="$(stat -c %s "banana-os-$GITHUB_SHA.tar.gz")" '{printf "%s  %10d  %s\n", $1, s, $2}')
          } > src-out/SOURCES.txt
          rm -f src-out/upstream/SOURCES-*.txt
          tar -C src-out -cf Banana_OS-sources.tar .
          ls -la Banana_OS-sources.tar
          head -20 src-out/SOURCES.txt
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Banana OS build ${{ github.run_number }}
          prerelease: true
          # Tag was reserved and verified above; omit target_commitish so the
          # release API does not re-check old workflow files against main.
          fail_on_unmatched_files: true
          files: |
            Banana_OS.iso
            Banana_OS-32.iso
            Banana_OS-mesa.iso
            java.bpk
            Banana_OS-sources.tar
            banana-sdk.tar.gz
            banana-driver-sdk.tar.gz
          body: |
            - **Banana_OS.iso**: the standard image, 64-bit (BIOS and UEFI; CD, USB stick or disk).
            - **Banana_OS-32.iso**: the 32-bit system alone, for processors without 64-bit support (no Unix ports, Terminal, Java or Mesa: those are 64-bit).
            - **Banana_OS-mesa.iso**: the 64-bit image with the Mesa runtime: Intel Crocus/Iris (Core 1st–10th generation), AMD r600, VirGL and software fallback. Tested with 1 GiB RAM.
            - **Banana_OS-full.iso** (added when its build finishes - it does not hold the release up): everything in - the Mesa runtime, every Unix port (Neovim and Git too) and Java, installed from the image at the first start. 2 GiB RAM recommended.
            - **java.bpk**: Java (OpenJDK 17, LWJGL 3, OpenGL) for the 64-bit images: `pkg install java.bpk`.
            - **Banana_OS-sources.tar**: the corresponding source of everything above (every upstream source archive as built, checked by SHA-256 in its SOURCES.txt, and the repository at this tag).
            - **banana-sdk.tar.gz**: application SDK. **banana-driver-sdk.tar.gz**: independent hardware Driver SDK.

            LibJS is integrated in the 64-bit images. Each image's /LICENSES (and /usr/share/licenses on the system) has the licences and THIRD-PARTY-NOTICES. `update` refuses an image without the kernel the computer runs (Banana_OS-32.iso on a 64-bit system, or the reverse).

            Intel acceleration is experimental: crocus has run on a real Sandy Bridge (HD Graphics 2000); other generations are tested on models only. Radeon HD 5450 - 7450 (TeraScale 2) OpenGL through Mesa r600 is experimental too, tested on a model only (needs `gpu experimental on`). A supported GPU is used by default; `gpu3d test` checks it, `glinfo` shows the renderer, and `gpu3d off` restores software rendering.

            [Graphics setup and limits](https://github.com/qcom-toolbox/Banana-OS/blob/${{ github.sha }}/GPU.md#mesa-iso-in-prereleases)

  # The all-in-one image: the Mesa runtime, every port (the optional ones
  # installed too) and Java (java.bpk on the image, installed from it at the
  # start). Not needed for the release: publish-full adds it to the
  # published release once it built and started; when it fails, the release
  # is out all the same.
  build-full:
    name: Build and start the all-in-one ISO
    needs: [libjs, mesa, java]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo python3 tools/ci_apt_mirrors.py
          sudo apt-get update -qq
          sudo apt-get install -y nasm gcc-multilib binutils xorriso mtools python3 sbsigntool efitools ncurses-bin zsh cmake git

      # Secure Boot: the loaders are signed with the Banana OS key (a repository
      # secret); without it (forks) they are built unsigned
      - name: Secure Boot key
        env:
          SB_KEY_PEM: ${{ secrets.BANANA_SB_KEY }}
        run: |
          if [ -n "$SB_KEY_PEM" ]; then
            mkdir -p ~/.banana-secureboot && chmod 700 ~/.banana-secureboot
            printf '%s\n' "$SB_KEY_PEM" > ~/.banana-secureboot/banana-sb.key
            chmod 600 ~/.banana-secureboot/banana-sb.key
          fi

      # FFmpeg for the Media Player and Music apps (ports/ffmpeg/build.sh):
      # built once, then kept until the build script or the SDK's libc changes
      - name: FFmpeg build cache
        uses: actions/cache@v4
        with:
          path: |
            ports/ffmpeg/src
            ports/ffmpeg/build
          key: ffmpeg-7.1-${{ hashFiles('ports/ffmpeg/build.sh', 'sdk/lib/*.c', '!sdk/lib/banana.c', 'sdk/include/**', '!sdk/include/banana*.h') }}

      # the Unix programs in /bin (ports/<name>/build.sh with ports/port.sh,
      # 64-bit): bash, coreutils, grep, sed, findutils, diffutils, gawk,
      # ncurses (+ terminfo), less, zsh; the optional editors (nano, vim, vi,
      # neovim) and git - the downloads kept, the builds too
      # while their scripts and the SDK stay (port.sh reconfigures otherwise)
      - name: Unix ports build cache
        uses: actions/cache@v4
        with:
          path: |
            ports/bash/src
            ports/bash/build
            ports/coreutils/src
            ports/coreutils/build
            ports/grep/src
            ports/grep/build
            ports/sed/src
            ports/sed/build
            ports/findutils/src
            ports/findutils/build
            ports/diffutils/src
            ports/diffutils/build
            ports/gawk/src
            ports/gawk/build
            ports/ncurses/src
            ports/ncurses/build
            ports/less/src
            ports/less/build
            ports/zsh/src
            ports/zsh/build
            ports/nano/src
            ports/nano/build
            ports/vim/src
            ports/vim/build
            ports/vi/src
            ports/vi/build
            ports/neovim/src
            ports/neovim/build
            ports/git/src
            ports/git/build
            ports/neofetch/src
            ports/neofetch/build
          key: unix-ports-v2-${{ hashFiles('ports/port.sh', 'ports/bash/*', 'ports/coreutils/*', 'ports/grep/*', 'ports/sed/*', 'ports/findutils/*', 'ports/diffutils/*', 'ports/gawk/*', 'ports/ncurses/*', 'ports/less/*', 'ports/zsh/*', 'ports/nano/*', 'ports/vim/*', 'ports/vi/*', 'ports/neovim/*', 'ports/git/*', 'ports/neofetch/*', 'sdk/tools/banana-*', 'sdk/lib/*.c', 'sdk/include/**') }}
          restore-keys: unix-ports-v2-

      - name: Download the integrated LibJS renderer
        uses: actions/download-artifact@v4
        with:
          name: experimental-libjs-packages
          path: libjs-packages
      - name: Download Intel Mesa runtime
        uses: actions/download-artifact@v4
        with:
          name: mesa-intel-runtime
          path: mesa-packages
      - name: Download java.bpk
        uses: actions/download-artifact@v4
        with:
          name: java-bundle
          path: java-bundle
      - name: Verify the packages
        run: |
          (cd libjs-packages && sha256sum -c LIBJS-SHA256SUMS)
          (cd mesa-packages && sha256sum -c MESA-SHA256SUMS)
          python3 sdk/tools/bpkg check java-bundle/java.bpk
      - name: Build Banana_OS-full.iso
        run: |
          make clean
          make -j"$(nproc)" FULL=1 ISO_KERNELS=64 LIBJS_WORKER_BPK="$PWD/libjs-packages/libjsworker-x86_64.bpk" \
               MESA_BPK="$PWD/mesa-packages/mesa-x86_64.bpk" JAVA_BPK="$PWD/java-bundle/java.bpk" Banana_OS.iso
          rm -f ~/.banana-secureboot/banana-sb.key
          mv Banana_OS.iso Banana_OS-full.iso
          ls -la Banana_OS-full.iso
      - name: Start it - Java, Mesa, the ports, the licences
        timeout-minutes: 40
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          python3 tools/serialtest.py --log build/logs/full/serial.log --boot-timeout 900 --timeout 600 \
              --cmd 'cat /etc/banana-extras ## EXTRAS/JAVA.BPK' \
              --cmd 'java -version ## OpenJDK' \
              --cmd 'glinfo ## glinfo: every check passed' \
              --cmd 'nvim --version ## NVIM' \
              --cmd 'git --version ## git version' \
              --cmd 'ls /usr/share/licenses/java/LICENSES ## LWJGL' \
              --cmd 'ls /usr/share/licenses/git ## COPYING' \
              --cmd 'selftest ## 0 failed' \
              -- -accel tcg -cdrom Banana_OS-full.iso -boot d -m 2G -smp 4 -nic none
      - name: Preserve the start's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-boot-${{ github.sha }}-${{ github.run_attempt }}
          path: build/logs/full/*.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: full-iso-${{ github.sha }}
          path: Banana_OS-full.iso
          if-no-files-found: error
          retention-days: 3

  publish-full:
    name: Add the all-in-one ISO to the release
    needs: [build-full, publish-isos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: full-iso-${{ github.sha }}
      - name: Add it to the pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Banana OS build ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: true
          files: Banana_OS-full.iso
