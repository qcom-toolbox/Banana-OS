name: kcmd-output-host regressions
on:
  push:
    branches: ['upstream/kcmd-drain']
  pull_request:
    paths: ['assets/wallpapers/**', 'kernel/**', 'net/**', 'sdk/**', 'shell/**', 'tools/**', '.github/workflows/kcmd-output-host.yml']
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo python3 tools/ci_apt_mirrors.py
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib nasm
      - name: Run regressions
        run: |
          python3 tools/test_kcmd_output.py --sanitize
          python3 tools/test_program_load.py --sanitize
          python3 tools/test_update_elf.py
          python3 tools/test_landscapes.py
          python3 tools/test_wallpaper.py --sanitize
          python3 tools/test_wallpaper.py --32 --sanitize
          python3 tools/test_notification.py --sanitize
          python3 tools/test_notification.py --32
          python3 tools/test_elf_loader.py --sanitize
          python3 tools/test_elf_loader.py --32 --sanitize
          python3 tools/test_fd_sync.py --sanitize
          python3 tools/test_fd_sync.py --32
          python3 tools/test_mouse_capture.py --sanitize
          python3 tools/test_mouse_capture.py --32
          python3 tools/test_config.py --sanitize
          python3 tools/test_config.py --32
          python3 tools/test_desktop_layout.py --sanitize
          python3 tools/test_desktop_layout.py --32 --sanitize
          python3 tools/test_fs_mutation.py --sanitize
          python3 tools/test_fs_mutation.py --32 --sanitize
          python3 tools/test_fileops.py --sanitize
          python3 tools/test_fileops.py --32 --sanitize
          python3 tools/test_kcmd_output.py --32
          gcc -m64 -ffreestanding -fsyntax-only -Ikernel -Inet -Isdk/include kernel/app.c kernel/gui.c kernel/fileops.c kernel/explorer.c kernel/shortcut.c
          gcc -m32 -ffreestanding -fsyntax-only -Ikernel -Inet -Isdk/include kernel/app.c kernel/gui.c kernel/fileops.c kernel/explorer.c kernel/shortcut.c
