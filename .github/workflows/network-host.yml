name: Network host tests
on:
  pull_request:
    paths:
      - 'net/**'
      - 'tools/test_loopback.py'
      - 'tools/tests/loopback.c'
      - 'third_party/igc/**'
      - 'third_party/rge/**'
      - 'third_party/rtwn/**'
      - 'third_party/rtw88/**'
      - 'tools/test_rtl8811cu.py'
      - 'tools/tests/rtl8811cu*.c'
      - 'third_party/aq/**'
      - 'third_party/asix/**'
      - 'third_party/athn/**'
      - 'tools/test_ar9380.py'
      - 'tools/tests/ar9380*.c'
      - 'tools/test_ar9280.py'
      - 'tools/tests/ar9280.c'
      - 'tools/test_bcm5720.py'
      - 'tools/tests/bcm5720.c'
      - 'tools/test_aqc107.py'
      - 'tools/tests/aqc107.c'
      - 'firmware/realtek/**'
      - 'tools/test_rtl8188eu.py'
      - 'tools/tests/rtl8188eu.c'
      - 'tools/test_r8125.py'
      - 'tools/tests/r8125.c'
      - 'tools/test_igc.py'
      - 'tools/tests/igc.c'
      - 'crypto/**'
      - 'firmware/mediatek/**'
      - 'kernel/*.h'
      - 'kernel/nettray.c'
      - 'kernel/gui.c'
      - 'tools/test_nettray.py'
      - 'tools/tests/nettray.c'
      - 'usb/usbcore.c'
      - 'tools/tests/net_*.c'
      - 'tools/tests/usb_ethernet.c'
      - 'tools/test_network_drivers.py'
      - 'tools/test_wifi_*.py'
      - 'tools/test_mt7601.py'
      - 'tools/wifi_test_vectors.py'
      - 'tools/tests/mt7601.c'
      - 'tools/tests/wifi_*.c'
      - '.github/workflows/network-host.yml'
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y gcc-multilib python3-cryptography
      - name: Network policy and USB driver models under sanitizers
        run: python3 tools/test_network_drivers.py --sanitize
      - name: Network models on the 32-bit fallback
        run: python3 tools/test_network_drivers.py --32
      - name: Offline TCP and UDP loopback, timeouts and physical spoof rejection
        run: python3 tools/test_loopback.py --sanitize && python3 tools/test_loopback.py --32
      - name: DHCP lifecycle regression
        run: python3 tools/test_dhcp_state.py --sanitize && python3 tools/test_dhcp_state.py --32
      - name: DNS cache and TCP fallback regression
        run: python3 tools/test_dns_tcp.py --sanitize && python3 tools/test_dns_tcp.py --32
      - name: Existing RTL8111/8168 driver regression
        run: |
          cc -O1 -no-pie -w -I tools/tests/r8169 -I kernel -I net tools/tests/test_r8169.c net/r8169.c -o /tmp/test-r8169
          /tmp/test-r8169
      - name: WPA2 independent cryptographic vectors
        run: python3 tools/test_wifi_crypto.py --sanitize && python3 tools/test_wifi_crypto.py --32
      - name: Wi-Fi association, handshake, replay and malformed frame tests
        run: python3 tools/test_wifi_station.py --sanitize && python3 tools/test_wifi_station.py --32
      - name: MT7601U radio firmware, USB transport and WPA2 integration model
        run: python3 tools/test_mt7601.py --sanitize && python3 tools/test_mt7601.py --32
      - name: RTL8188EUS firmware, calibration, USB and WPA2 integration model
        run: python3 tools/test_rtl8188eu.py --sanitize && python3 tools/test_rtl8188eu.py --32
      - name: RTL8811CU firmware regions, EFUSE, USB lifetime and WPA2 integration
        run: python3 tools/test_rtl8811cu.py --sanitize && python3 tools/test_rtl8811cu.py --32
      - name: AR9280 EEPROM, radio calibration, PCI DMA and WPA2 integration
        run: python3 tools/test_ar9280.py --sanitize && python3 tools/test_ar9280.py --32
      - name: AR9380 compressed EEPROM, calibration, separate DMA FIFOs and WPA2
        run: python3 tools/test_ar9380.py --sanitize && python3 tools/test_ar9380.py --32
      - name: Intel I225/I226 native HAL and DMA model
        run: python3 tools/test_igc.py --sanitize && python3 tools/test_igc.py --32
      - name: BCM5720 reset, PHY, management exclusion and independent DMA rings
        run: python3 tools/test_bcm5720.py --sanitize && python3 tools/test_bcm5720.py --32
      - name: AQC107 firmware, PHY, PCI power and independent DMA rings
        run: python3 tools/test_aqc107.py --sanitize && python3 tools/test_aqc107.py --32
      - name: RTL8125 A/B/D native MAC, PHY, firmware and DMA model
        run: python3 tools/test_r8125.py --sanitize && python3 tools/test_r8125.py --32
      - name: Taskbar Wi-Fi actions, password erasure, hotplug and layout
        run: python3 tools/test_nettray.py --sanitize && python3 tools/test_nettray.py --32
