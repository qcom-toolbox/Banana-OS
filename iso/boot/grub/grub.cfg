set timeout=3

# graphics drivers for the kernel's framebuffer request (VBE on BIOS,
# GOP on UEFI)
insmod all_video

# 64-bit kernel when the CPU supports long mode, 32-bit otherwise
if cpuid -l; then
    set default=0
else
    set default=2
fi

menuentry "Banana OS 0.5 (64-bit)" {
    source /boot/grub/medium.cfg
    multiboot2 /boot/kernel64.bin root=$root medium=$banana_medium
    boot
}

menuentry "Banana OS 0.5 (64-bit, one CPU core)" {
    source /boot/grub/medium.cfg
    multiboot2 /boot/kernel64.bin root=$root medium=$banana_medium nosmp
    boot
}

menuentry "Banana OS 0.5 (32-bit)" {
    source /boot/grub/medium.cfg
    multiboot2 /boot/kernel.bin root=$root medium=$banana_medium
    boot
}

# every boot step written on the screen, no boot screen: where a computer stops
menuentry "Banana OS 0.5 (64-bit, boot messages)" {
    source /boot/grub/medium.cfg
    multiboot2 /boot/kernel64.bin root=$root medium=$banana_medium verbose
    boot
}

menuentry "Banana OS 0.5 (32-bit, boot messages)" {
    source /boot/grub/medium.cfg
    multiboot2 /boot/kernel.bin root=$root medium=$banana_medium verbose
    boot
}
